name: Legacy tester diagnostic

on:
  pull_request:
    paths:
      - 'scripts/legacy-tester-audit/**'
      - '.github/workflows/legacy-tester-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/legacy-tester-audit/**'
      - '.github/workflows/legacy-tester-audit.yml'

permissions:
  contents: read

jobs:
  legacy-tester-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline diagnostic regression suite (no network or live writes)
        run: python3 -B -m unittest discover -s scripts/legacy-tester-audit -p 'test_*.py' -v

name: Teste

# Rulează la fiecare PR și la fiecare push pe main. Cu „Allow auto-merge” activat și
# regula „Require status checks: teste”, un PR intră singur în main doar când trec testele.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Puntea (channel_bridge)
        run: python3 -B -m unittest discover -s channel_bridge/tests -v
      - name: Locuri de apel paralele (pod_locuri)
        run: python3 -B -m unittest discover -s pod_locuri/tests -v
      - name: Orchestrare
        run: python3 -B -m unittest discover -s orchestration/tests -v
      - name: Grupuri WhatsApp
        run: python3 -B -m unittest discover -s whatsapp_grupuri/tests -v
      - name: Export
        run: python3 -B -m unittest discover -s tests -v
      - name: Deploy fail-closed (servicii simulate, fără rețea)
        run: python3 -B deploy/test_repara_fail_closed.py
      - name: Sintaxă scripturi de deploy
        run: |
          bash -n deploy/install-shared-channel.sh
          bash -n deploy/auto-deploy-web.sh
          bash -n deploy/repara-apel-whatsapp.sh
          python3 -m py_compile deploy/repara_pod.py deploy/repara_logare_locuri.py
          bash -n deploy/repara-pas2.sh
          bash -n deploy/repara-pas3.sh
          bash -n deploy/repara-tot.sh
          bash -n deploy/instaleaza-grupuri.sh
          bash -n deploy/verifica-grupuri-whatsapp.sh
          python3 -m py_compile deploy/repara_grupuri.py
          python3 -m py_compile deploy/repara_necunoscuti.py
          bash -n deploy/repara-bucle.sh
          python3 -B -m unittest deploy/test_repara_bucle_remediere.py -v
          bash -n deploy/repara-curatenie.sh
          python3 -B -m unittest deploy/test_repara_curatenie_playwright.py -v
      - name: Export sigur (safe-export)
        working-directory: deploy/safe-export
        run: |
          python3 -B -m unittest test_export_safe.py -v
          bash -n copie-server-in-github.sh

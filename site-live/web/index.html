<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KelionAI</title><link rel="stylesheet" href="/style.css"><script src="/app.js" type="module"></script></head>
<body><main>
<header><span class="mark">K</span><div class="brand"><h1>KelionAI</h1><p>Conversația ta cu Kelion</p></div>
<div class="account" id="workspace-account"><span id="account"></span><button id="logout" class="ghost">Ieșire</button></div></header>
<p id="status" role="status">Se verifică configurația…</p>
<div id="login"><div id="google"></div><button id="signin" hidden>Conectare Google</button></div>
<section id="workspace" hidden>
  <aside class="panel list" id="history" hidden><div class="panel-head"><h2>Cererile tale</h2><button id="refresh" class="ghost small">Actualizează</button><button id="history-close" class="ghost small" aria-label="Închide istoricul">✕</button></div><div id="tasks"></div></aside>
  <section class="stage" aria-labelledby="answer-title">
    <div class="kelion" id="kelion" data-state="idle" aria-hidden="true"><svg viewBox="0 0 120 130" class="bot">
<g class="body-g">
<circle cx="34" cy="40" r="20" class="c"/><circle cx="60" cy="28" r="24" class="c"/><circle cx="86" cy="40" r="20" class="c"/><circle cx="60" cy="48" r="30" class="c"/>
<rect x="30" y="34" width="60" height="38" rx="10" class="screen"/>
<g class="face"><path d="M42 46 l7 6 -7 6" class="eye"/><rect x="58" y="56" width="14" height="4" rx="2" class="mouth"/></g>
<rect x="44" y="80" width="32" height="26" rx="8" class="c"/><path d="M52 88 l4 4 -4 4" class="eye small"/><rect x="60" y="94" width="8" height="2.5" rx="1" class="tag"/>
<rect x="30" y="84" width="10" height="16" rx="5" class="c arm l"/><rect x="80" y="84" width="10" height="16" rx="5" class="c arm r"/>
<rect x="48" y="106" width="9" height="12" rx="4" class="c"/><rect x="63" y="106" width="9" height="12" rx="4" class="c"/>
</g></svg><span class="ring"></span></div>
    <h2 id="answer-title" class="sr">Kelion</h2><p id="kelion-state" class="kstate">Pregătit</p>
    <ol id="monitor" class="monitor" aria-label="Monitor: ce lucrează Kelion acum"><li class="idle">Monitor: aici apare, în timp real, ce lucrează Kelion.</li></ol>
    <div id="conv" class="conv" aria-label="Conversația scrisă"><p class="hint">Conversația ta cu Kelion apare aici.</p></div>
  </section>
  <form id="chat" class="composer"><label for="task" class="sr">Cu ce te poate ajuta Kelion?</label>
    <div class="bar"><textarea id="task" maxlength="100000" rows="1" required placeholder="Scrie-i lui Kelion…"></textarea>
      <button id="dictate" type="button" class="ghost icon" hidden title="Dictare" aria-label="Dictare">✎🎤</button>
      <button id="call-start" type="button" class="call" disabled title="Conversație vocală live" aria-label="Conversație vocală live">🎙</button>
      <button id="send" type="submit" title="Trimite" aria-label="Trimite">➤</button></div>
    <div class="actions"><button id="history-open" type="button" class="ghost small">Istoric</button><span class="sep"></span>
      <label class="gender" for="voice-gender">Voce</label><select id="voice-gender"><option value="feminin">Feminin</option><option value="masculin">Masculin</option></select>
      <button id="call-interrupt" type="button" class="ghost small" disabled hidden>Întrerupe</button><button id="call-end" type="button" class="end small" disabled hidden>Încheie</button></div>
    <p class="voice"><span id="call-status" role="status"></span> <span id="voice-transcript" aria-live="polite"></span></p>
    <p id="voice-note" class="sr"></p>
  </form>
</section>
</main></body></html>
